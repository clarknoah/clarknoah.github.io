<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Noah Clark, independent AI and systems engineer. Knowledge graphs, agent pipelines, and the typed data infrastructure underneath them."
    />
    <meta property="og:title" content="Noah Clark · AI and systems engineering" />
    <meta
      property="og:description"
      content="With over 17 years of combined experience across software engineering, systems design, and AI, I'm here to help you build the next generation of intelligent systems."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://noahclark.ing" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Noah Clark · AI and systems engineering</title>
    <script>
      // Apply theme before paint to avoid a flash.
      (function () {
        try {
          var p = localStorage.getItem('theme') || 'light'
          var t = p === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : p
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
    <style>
      /* Instant shell: a styled first paint before the bundle loads. Theme-aware. */
      html { background: #f6f7f9; color: #14181f; font-optical-sizing: auto; }
      html[data-theme='dark'] { background: #11151c; color: #e6e9ef; }
      body { margin: 0; font-family: 'Newsreader', Georgia, 'Times New Roman', serif; }
      #boot {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.75rem;
      }
      #boot .nm { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 600; letter-spacing: -0.01em; }
      #boot .ti { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 1.1rem; color: #59626f; }
      html[data-theme='dark'] #boot .ti { color: #9aa3b2; }
      #boot .dot { width: 6px; height: 6px; border-radius: 99px; background: #27457d; animation: p 1s ease-in-out infinite; }
      html[data-theme='dark'] #boot .dot { background: #6f9ae0; }
      @keyframes p { 0%, 100% { opacity: 0.25 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="nm">Noah Clark</div>
        <div class="ti">AI &amp; systems engineering</div>
        <div class="dot"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
