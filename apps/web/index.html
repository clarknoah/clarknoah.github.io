<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Noah Clark, independent AI and systems engineer. Knowledge graphs, agent pipelines, and the typed data infrastructure underneath them."
    />
    <meta property="og:title" content="Noah Clark · AI and systems engineering" />
    <meta
      property="og:description"
      content="I build systems that people and AI agents can both operate. Knowledge graphs, agent pipelines, and data standardisation for research and engineering teams."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://noahclark.ing" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Noah Clark · AI and systems engineering</title>
    <script>
      // Apply theme before paint to avoid a flash.
      (function () {
        try {
          var p = localStorage.getItem('theme') || 'light'
          var t = p === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : p
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
    <style>
      /* Instant shell: a styled first paint before the bundle loads. Theme-aware. */
      html { background: #f6f3ec; color: #211d17; font-optical-sizing: auto; }
      html[data-theme='dark'] { background: #15130f; color: #ece5d7; }
      body { margin: 0; font-family: 'Newsreader', Georgia, 'Times New Roman', serif; }
      #boot {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.75rem;
      }
      #boot .nm { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 600; letter-spacing: -0.01em; }
      #boot .ti { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; letter-spacing: 0.15em; color: #ad6a14; }
      html[data-theme='dark'] #boot .ti { color: #e0a23b; }
      #boot .dot { width: 6px; height: 6px; border-radius: 99px; background: #ad6a14; animation: p 1s ease-in-out infinite; }
      html[data-theme='dark'] #boot .dot { background: #e0a23b; }
      @keyframes p { 0%, 100% { opacity: 0.25 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="nm">Noah Clark</div>
        <div class="ti">AI &amp; SYSTEMS ENGINEERING</div>
        <div class="dot"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
